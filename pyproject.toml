[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streammind"
version = "0.1.0"
description = "Event-gated streaming video dialogue on a LLaVA-OneVision-2 backbone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers>=4.45",
    "tokenizers",
    "accelerate>=0.30",
    "safetensors",
    "huggingface_hub",
    "sentencepiece",
    "einops",
    "timm",
    "numpy",
    "pillow",
    "decord",
    "imageio",
    "imageio-ffmpeg",
    "opencv-python",
    "scenedetect",
    "pytorch-lightning",
    "moviepy<2.0",
    "codec-video-prep",
]

[project.optional-dependencies]
train = ["deepspeed", "wandb", "pandas", "pyarrow"]

[project.urls]
"Homepage" = "https://github.com/kcz358/StreamMind"

[tool.setuptools.packages.find]
include = ["streammind*", "ov_train*"]
exclude = ["assets*", "docs*", "dist*", "scripts*", "tests*", "data*", "logs*", "temp*"]

[tool.wheel]
exclude = ["assets*", "docs*", "dist*", "scripts*", "tests*", "data*", "logs*", "temp*"]
